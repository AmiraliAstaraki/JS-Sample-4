<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: tahoma;
        }
        ul{
            background-color: #333;
            display: flex;
            list-style: none;

        }
        li{
            flex: 1;
        }
        a{
            display: block;
            padding: 10px 15px ;
            color: white;
            text-align: center;
        }
        a:hover{
            background-color: #777;
        }
        
    </style>
</head>
<body>
    <nav id="menu"></nav>



    <script>
        let menuitems=["خانه", "محصولات", "درباره من","تماس با ما"];
        
        let menu=document.getElementById("menu");
        let txt="<ul>";
        for (let index = 0; index < menuitems.length; index++) {
            debugger
            txt+="<li> <a href='#'>"+  menuitems[index] +"</a></li>";
            
            
        }
        txt+="</ul>";
        menu.innerHTML=txt;

        
        

    </script>
    
</body>
</html>
