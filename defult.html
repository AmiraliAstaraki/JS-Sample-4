<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>
<body>

    <p id="demo"></p>
    <script>
        let product={
            productname: "Mobile",
            amount:1000,
            discount:.5,
            payment: function(){
                return this.amount- (this.amount * this.amount);
            }
        };
        let demo=document.getElementById("demo");
        demo.innerHTML= product.productname + "<br>"+
                        "<b>"+product.amount+"</b> <br>" +
                        product.discount+ "<br>" +
                        product.payment();



        
       

    </script>
    
</body>
</html>
