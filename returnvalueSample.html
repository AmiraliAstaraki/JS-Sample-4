<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Document</title>
</head>
<body>
    <p id="demo"></p>
    <button onclick="browse()">caculate</button>
    <script>
        let para=document.querySelector("#demo");
        const pi=3.14;
        let r=100;
        function area(){
            return r*r * pi;
            

        }
        function browse() {
            para.innerHTML=area();
        }


    </script>
